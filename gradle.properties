org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Reuse task outputs across builds via the local build cache.
org.gradle.caching=true
# Reuse the configuration phase across builds. The post-connected-test reseed
# used to register a taskGraph.afterTask listener, which the configuration
# cache cannot record; it is now a real task wired with finalizedBy.
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.builtInKotlin=false
android.newDsl=false
